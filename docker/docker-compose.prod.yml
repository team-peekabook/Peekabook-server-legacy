services:
  peekabook-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: peekabook-app-prod
    ports:
      - "3000:3000"
    env_file:
      - ../.env.prod
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  default:
    name: peekabook-app-prod
